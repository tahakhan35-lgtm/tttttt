<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #050607;
  --bg-panel: #0A0D0B;
  --bg-panel-alt: #0F1310;
  --border: #1C231E;
  --text-primary: #D7F7E4;
  --text-dim: #5B6D62;
  --signal-green: #39FF88;
  --signal-cyan: #4CE6FF;
  --signal-violet: #C77DFF;
  --signal-red: #FF4F6D;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-ui: 'Space Grotesk', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui); }
body { display: flex; flex-direction: column; position: relative; }
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 999;
  background: repeating-linear-gradient(to bottom, rgba(57,255,136,0.015), rgba(57,255,136,0.015) 1px, transparent 1px, transparent 3px);
  mix-blend-mode: screen;
}
.topbar { display: flex; align-items: center; gap: 24px; padding: 10px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-weight: 700; font-size: 16px; letter-spacing: 1px; }
.brand-mark { color: var(--signal-green); text-shadow: 0 0 8px rgba(57,255,136,0.6); }
.pipeline-indicator { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); flex: 1; min-width: 180px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
.status-dot.planning, .status-dot.coding { background: var(--signal-green); box-shadow: 0 0 8px var(--signal-green); animation: pulse 1.1s infinite ease-in-out; }
.status-dot.reviewing, .status-dot.fixing { background: var(--signal-violet); box-shadow: 0 0 8px var(--signal-violet); animation: pulse 1.1s infinite ease-in-out; }
.status-dot.done { background: var(--signal-cyan); box-shadow: 0 0 8px var(--signal-cyan); }
.status-dot.error { background: var(--signal-red); box-shadow: 0 0 8px var(--signal-red); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.topbar-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.select-ctrl { background: var(--bg-panel-alt); color: var(--text-primary); border: 1px solid var(--border); border-radius: 5px; font-family: var(--font-mono); font-size: 12px; padding: 6px 8px; }
.critique-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; font-family: var(--font-mono); color: var(--text-dim); cursor: pointer; user-select: none; }
.critique-toggle input { accent-color: var(--signal-violet); }
.btn-primary { background: var(--signal-green); color: #04150B; border: none; border-radius: 6px; padding: 7px 14px; font-family: var(--font-mono); font-weight: 600; font-size: 12.5px; cursor: pointer; box-shadow: 0 0 12px rgba(57,255,136,0.25); transition: filter .15s ease, box-shadow .15s ease; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 0 18px rgba(57,255,136,0.45); }
.btn-primary:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; box-shadow: none; }
.workspace { flex: 1; display: grid; grid-template-columns: 340px 220px 1fr; min-height: 0; }
.panel { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
.code-panel { border-right: none; }
.panel-label { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.chat-panel { background: var(--bg-panel); }
.chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { font-size: 13px; line-height: 1.5; padding: 9px 12px; border-radius: 6px; max-width: 92%; white-space: pre-wrap; font-family: var(--font-mono); }
.msg-user { align-self: flex-end; background: rgba(57,255,136,0.1); border: 1px solid rgba(57,255,136,0.3); color: var(--signal-green); }
.msg-assistant { align-self: flex-start; background: var(--bg-panel-alt); border: 1px solid var(--border); }
.msg-system { align-self: center; color: var(--text-dim); font-size: 11.5px; background: none; }
.chat-input-row { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
.chat-input-row textarea { flex: 1; resize: none; background: var(--bg-panel-alt); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: var(--font-mono); font-size: 12.5px; padding: 8px 10px; }
.chat-input-row textarea:focus { outline: 1px solid var(--signal-cyan); }
.tree-panel { background: var(--bg-panel-alt); }
.file-tree { flex: 1; overflow-y: auto; padding: 6px; }
.file-item { font-family: var(--font-mono); font-size: 12px; padding: 6px 8px; border-radius: 5px; cursor: pointer; color: var(--text-dim); word-break: break-all; }
.file-item:hover { background: var(--border); color: var(--text-primary); }
.file-item.active { background: rgba(76,230,255,0.1); color: var(--signal-cyan); box-shadow: inset 2px 0 0 var(--signal-cyan); }
.empty-hint { color: var(--text-dim); font-size: 12px; padding: 12px 8px; line-height: 1.5; font-family: var(--font-mono); }
.code-panel { background: var(--bg-base); }
.code-view { flex: 1; margin: 0; overflow: auto; padding: 16px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: var(--text-primary); white-space: pre; }
.build-log-strip { height: 110px; flex-shrink: 0; background: #020302; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
.build-log-title { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); padding: 6px 14px 4px; }
.build-log { flex: 1; overflow-y: auto; padding: 0 14px 8px; font-family: var(--font-mono); font-size: 11.5px; }
.log-line { color: var(--signal-green); opacity: 0.75; padding: 1px 0; }
.log-time { color: var(--text-dim); margin-right: 8px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
@media (max-width: 900px) {
  .workspace { grid-template-columns: 1fr; grid-auto-rows: min-content; }
  .panel { border-right: none; border-bottom: 1px solid var(--border); max-height: 300px; }
}
</style>
</head>
<body>

  <div class="scanlines"></div>

  <header class="topbar">
    <div class="brand"><span class="brand-mark">&gt;_</span><span>CODEBOX</span></div>
    <div class="pipeline-indicator">
      <span class="status-dot idle" id="status-dot"></span>
      <span id="status-text">idle — awaiting instruction</span>
    </div>
    <div class="topbar-actions">
      <select id="output-mode-select" class="select-ctrl" title="Output mode">
        <option value="single-file">single file</option>
        <option value="multi-file">multi file</option>
      </select>
      <label class="critique-toggle"><input type="checkbox" id="critique-toggle" /><span>self-review</span></label>
      <button id="download-btn" class="btn-primary" disabled>↓ download</button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel chat-panel">
      <div class="panel-label">chat</div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <textarea id="chat-input" placeholder="make a social media app / a REST API / a landing page…" rows="2"></textarea>
        <button id="send-btn" class="btn-primary">build</button>
      </div>
    </section>
    <section class="panel tree-panel">
      <div class="panel-label">files</div>
      <div class="file-tree" id="file-tree"></div>
    </section>
    <section class="panel code-panel">
      <div class="panel-label" id="code-view-label">code</div>
      <pre class="code-view" id="code-view"></pre>
    </section>
  </main>

  <footer class="build-log-strip">
    <div class="build-log-title">build log</div>
    <div class="build-log" id="build-log"></div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- keys + model/output settings live in the sibling config.js file -->
  <script src="config.js"></script>
  <script>
  // ===== Codebox engine (inline) =====

  const SETTINGS = (typeof CODEBOX_SETTINGS !== "undefined") ? CODEBOX_SETTINGS : {
    MODELS: { planner: "deepseek/deepseek-chat-v3.1:free", coder: "qwen/qwen3-coder:free", reviewer: "deepseek/deepseek-chat-v3.1:free", fixer: "deepseek/deepseek-chat-v3.1:free" },
    SITE_URL: "https://localhost", SITE_NAME: "Codebox",
    ENABLE_SELF_CRITIQUE: true, DEFAULT_OUTPUT_MODE: "single-file", REQUEST_TIMEOUT_MS: 60000,
  };
  const KEYS = (typeof CODEBOX_KEYS !== "undefined") ? CODEBOX_KEYS : { planner: [], coder: [], reviewer: [], fixer: [] };

  const OUTPUT_MODE_KEY = "codebox_output_mode";
  const state = { messages: [], files: {}, stage: "idle", outputMode: localStorage.getItem(OUTPUT_MODE_KEY) || SETTINGS.DEFAULT_OUTPUT_MODE };

  const el = {
    log: document.getElementById("build-log"), chat: document.getElementById("chat-messages"),
    input: document.getElementById("chat-input"), send: document.getElementById("send-btn"),
    fileTree: document.getElementById("file-tree"), codeView: document.getElementById("code-view"),
    codeViewLabel: document.getElementById("code-view-label"), statusDot: document.getElementById("status-dot"),
    statusText: document.getElementById("status-text"), downloadBtn: document.getElementById("download-btn"),
    critiqueToggle: document.getElementById("critique-toggle"), outputModeSelect: document.getElementById("output-mode-select"),
  };

  el.critiqueToggle.checked = SETTINGS.ENABLE_SELF_CRITIQUE;
  el.outputModeSelect.value = state.outputMode;
  el.outputModeSelect.addEventListener("change", () => {
    state.outputMode = el.outputModeSelect.value;
    localStorage.setItem(OUTPUT_MODE_KEY, state.outputMode);
    logLine(`Output mode set to "${state.outputMode}" — remembered for next time.`);
  });

  // key rotation across however many keys are configured for a stage (any number of "rounds" just means a longer array)
  async function callModel(stageKey, systemPrompt, userPrompt) {
    const model = SETTINGS.MODELS[stageKey];
    const usableKeys = (KEYS[stageKey] || []).filter(k => k && !k.includes("PASTE_KEY"));
    if (!usableKeys.length) throw new Error(`No API key set for "${stageKey}". Add one in config.js.`);

    let lastError;
    for (let i = 0; i < usableKeys.length; i++) {
      const key = usableKeys[i];
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), SETTINGS.REQUEST_TIMEOUT_MS);
      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}`, "HTTP-Referer": SETTINGS.SITE_URL, "X-Title": SETTINGS.SITE_NAME },
          body: JSON.stringify({ model, messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userPrompt }], temperature: 0.3 }),
          signal: controller.signal,
        });
        clearTimeout(timeout);
        if (res.status === 429 || res.status === 401 || res.status === 403) {
          lastError = new Error(`Key #${i + 1} for "${stageKey}" hit ${res.status} — rotating to next key.`);
          logLine(lastError.message); continue;
        }
        if (!res.ok) { const t = await res.text().catch(() => ""); throw new Error(`OpenRouter error ${res.status}: ${t.slice(0, 300)}`); }
        const data = await res.json();
        const text = data?.choices?.[0]?.message?.content;
        if (!text) throw new Error("Empty response from model.");
        if (i > 0) logLine(`Recovered using key #${i + 1} for "${stageKey}".`);
        return text;
      } catch (err) {
        clearTimeout(timeout);
        if (err.name === "AbortError") { lastError = new Error(`Key #${i + 1} for "${stageKey}" timed out — rotating.`); logLine(lastError.message); continue; }
        lastError = err; continue;
      }
    }
    throw lastError || new Error(`All keys for "${stageKey}" failed.`);
  }

  // ---------- Pattern library: real-world feature sets the planner/coder consult ----------
  // This is what "training the tool" actually means here — not touching the model,
  // but giving the pipeline a reference of what each kind of app really needs, so it
  // stops guessing cold and starts building the way a real product in that category works.
  const PATTERN_LIBRARY = {
    "social media app": {
      keywords: ["social media", "social app", "instagram", "facebook", "twitter", "feed app"],
      core: "Auth (register/login, session persisted), a scrollable feed of posts (text/image), create-post composer, like + comment on posts, a stories row (24h-style, can be simulated), a simple profile page (avatar, bio, own posts grid), follow/unfollow between users, a basic DM/messaging view (thread list + conversation view). Data layer: localStorage-backed if no real backend requested (model users/posts/comments/messages as JSON collections with ids).",
      backend_note: "If the request implies a real multi-user backend (persists across devices/users), generate actual server files too (e.g. Node/Express + a JSON-file or SQLite store) in addition to the frontend, and say clearly in the plan notes that the server needs to be run separately with `node server.js`.",
    },
    "e-commerce store": {
      keywords: ["e-commerce", "ecommerce", "online store", "shop app", "shopping cart", "store website"],
      core: "Product catalog (grid + detail page), cart (add/remove/quantity, persisted), checkout flow (address + mock payment form, no real payment processing), order confirmation, simple category/search filtering, an admin-lite product list (add/edit products) if the request implies a seller side.",
      backend_note: "Real payment processing is out of scope — always build a mock/demo checkout, never wire up a live payment API.",
    },
    "blog / cms": {
      keywords: ["blog", "cms", "publishing platform", "article site"],
      core: "Post list (title, excerpt, date), full post view (markdown or rich text rendered), a simple author/editor view to create and edit posts, tags/categories, basic search.",
      backend_note: "Posts can be localStorage-backed for single-file mode; for multi-file, a simple JSON-file-backed API is enough.",
    },
    "chat / messaging app": {
      keywords: ["chat app", "messaging app", "whatsapp", "discord clone", "slack clone"],
      core: "Contact/room list, active conversation view with message bubbles + timestamps, message input with send, typing indicator (can be simulated), unread badges. Real-time sync across devices needs a backend (WebSocket) — otherwise scope it to a single-browser demo with simulated replies.",
      backend_note: "If true multi-user real-time is requested, generate a small WebSocket server file (Node + ws) alongside the frontend and say how to run it.",
    },
    "dashboard / admin panel": {
      keywords: ["dashboard", "admin panel", "analytics panel", "control panel"],
      core: "Sidebar nav, summary stat cards, at least one real chart (use Chart.js via CDN) fed by sample/mock data, a data table with sort/filter, a settings page. Favor clear information hierarchy over decoration.",
      backend_note: "Mock data is fine unless the request names a real data source.",
    },
    "portfolio / personal site": {
      keywords: ["portfolio", "personal website", "resume site", "cv site"],
      core: "Hero section, about section, a projects/work grid with case-study-style detail, a contact section/form (can be mailto: or a formatted contact block if no backend), simple smooth-scroll nav.",
      backend_note: "No backend needed unless a real contact-form submission endpoint is requested.",
    },
    "todo / productivity app": {
      keywords: ["todo app", "task manager", "productivity app", "to-do list"],
      core: "Add/edit/delete tasks, mark complete, due dates, simple priority or tag, filter (all/active/done), persisted in localStorage.",
      backend_note: "Rarely needs a backend — keep it client-only unless multi-device sync is explicitly requested.",
    },
    "forum / community board": {
      keywords: ["forum", "community board", "discussion board", "reddit clone"],
      core: "Category/board list, thread list per board, thread detail with nested or flat replies, new-thread composer, basic upvote/downvote.",
      backend_note: "localStorage for single-file demos; a small JSON-backed API for multi-file if persistence across users is implied.",
    },
    "landing page": {
      keywords: ["landing page", "product page", "marketing site", "waitlist page"],
      core: "Hero with clear value prop, feature highlights section, social proof/testimonials section, pricing (if applicable), a clear call-to-action (signup/waitlist form — can submit to a mock handler), footer.",
      backend_note: "No backend needed unless a real signup endpoint is requested.",
    },
  };

  function matchPatterns(userRequest) {
    const lower = userRequest.toLowerCase();
    const hits = [];
    for (const [name, def] of Object.entries(PATTERN_LIBRARY)) {
      if (def.keywords.some(kw => lower.includes(kw))) hits.push({ name, ...def });
    }
    return hits;
  }

  function patternContext(userRequest) {
    const hits = matchPatterns(userRequest);
    if (!hits.length) return "";
    return "\n\nReference pattern(s) for this kind of app — use these as the real-world baseline feature set, adapting to anything the request specifies on top:\n" +
      hits.map(h => `- ${h.name}: ${h.core}\n  Backend note: ${h.backend_note}`).join("\n");
  }

  function parseJSONLoose(text) {
    let cleaned = text.trim().replace(/^```(?:json)?/i, "").replace(/```$/i, "").trim();
    const first = cleaned.indexOf("{"), last = cleaned.lastIndexOf("}");
    if (first !== -1 && last !== -1 && last > first) cleaned = cleaned.slice(first, last + 1);
    return JSON.parse(cleaned);
  }

  const PLANNER_SYSTEM = `You are a senior software architect. Given a coding request, produce a short build plan.
Never ask the user clarifying questions — if the request is broad (e.g. "make a social media app"), make the
reasonable, real-world default choices yourself and note them as assumptions instead of asking.
Respond with ONLY raw JSON, no markdown fences, no commentary:
{ "summary": "one paragraph describing the approach", "files": [ { "path": "relative/file/path.ext", "purpose": "one line" } ], "notes": "assumptions you made" }`;

  function coderSystem(outputMode) {
    if (outputMode === "single-file") {
      return `You are a senior software engineer. Write ONE complete, working, runnable HTML file that bundles everything: markup, all CSS inside a single <style> tag, all JS inside a single <script> tag at the end of <body>. No local file references.
Never ask clarifying questions. If the request is broad (e.g. "make a social media app"), implement a real, working version of the obvious core features yourself: login/register (client-side/localStorage-backed if no backend implied), a feed, creating posts, a stories row, a simple DM view — build them for real, don't stub them.
Respond with ONLY raw JSON: { "files": [ { "path": "app.html", "content": "the FULL html file, real newlines escaped as \\n" } ] }
The files array must contain exactly one file.`;
    }
    return `You are a senior software engineer. Write complete, working, runnable code for every file in the plan.
Never ask clarifying questions. If the request is broad, implement the obvious real feature set yourself with sensible defaults — build it for real, not stubs.
Respond with ONLY raw JSON: { "files": [ { "path": "relative/file/path.ext", "content": "full file content, real newlines escaped as \\n" } ] }
Rules: complete file contents only, never truncated; code must be consistent across files; no explanations outside the JSON.`;
  }

  const REVIEWER_SYSTEM = `You are a strict code reviewer. Find real bugs: syntax errors, missing imports, undefined references, logic errors, mismatched signatures, anything that would crash on run. If a reference pattern's core feature list was provided in the original context, also flag any core feature that is clearly missing or only stubbed (e.g. a button that does nothing) — treat a missing core feature as an issue, not just crashes.
Respond with ONLY raw JSON: { "overall_ok": true or false, "issues": [ { "file": "path", "problem": "specific bug or missing feature" } ] }
If no real issues, overall_ok true and empty issues. Only real bugs/missing core features, not style nitpicks.`;

  function fixerSystem(outputMode) {
    const note = outputMode === "single-file" ? ` The project is a single "app.html" file — return the full corrected file.` : "";
    return `You are a senior engineer fixing bugs. Output the CORRECTED full contents of every file that needed a change.${note}
Respond with ONLY raw JSON: { "files": [ { "path": "relative/file/path.ext", "content": "full corrected file content" } ] }`;
  }

  function setStage(stage, label) { state.stage = stage; el.statusText.textContent = label; el.statusDot.className = "status-dot " + stage; logLine(label); }
  function logLine(text) {
    const line = document.createElement("div"); line.className = "log-line";
    const time = new Date().toLocaleTimeString([], { hour12: false });
    line.innerHTML = `<span class="log-time">${time}</span> ${escapeHtml(text)}`;
    el.log.appendChild(line); el.log.scrollTop = el.log.scrollHeight;
  }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  async function runPipeline(userRequest) {
    el.send.disabled = true;
    const existingFilesContext = Object.keys(state.files).length ? `\n\nExisting project files (edit/extend, keep unrelated parts unless implied):\n${JSON.stringify(state.files, null, 2)}` : "";
    try {
      const patterns = patternContext(userRequest);
      if (patterns) logLine(`Matched pattern(s): ${matchPatterns(userRequest).map(h => h.name).join(", ")}`);

      setStage("planning", "Planning: breaking the request into files…");
      const plan = parseJSONLoose(await callModel("planner", PLANNER_SYSTEM, userRequest + patterns + existingFilesContext));
      logLine(`Plan: ${plan.files.length} file(s) — ${plan.files.map(f => f.path).join(", ")}`);
      addChatMessage("assistant", `Plan: ${plan.summary}`);

      setStage("coding", "Coding: writing files…");
      const coderPrompt = `Original request: ${userRequest}${patterns}\n\nBuild plan:\n${JSON.stringify(plan, null, 2)}${existingFilesContext}`;
      const codeResult = parseJSONLoose(await callModel("coder", coderSystem(state.outputMode), coderPrompt));
      let files = {}; for (const f of codeResult.files) files[f.path] = f.content;
      logLine(`Generated ${Object.keys(files).length} file(s).`);

      if (el.critiqueToggle.checked) {
        setStage("reviewing", "Reviewing: checking for bugs…");
        const review = parseJSONLoose(await callModel("reviewer", REVIEWER_SYSTEM, `Original request: ${userRequest}${patterns}\n\nFiles:\n${JSON.stringify(files, null, 2)}`));
        if (!review.overall_ok && review.issues?.length) {
          logLine(`Found ${review.issues.length} issue(s): ${review.issues.map(i => i.file).join(", ")}`);
          setStage("fixing", "Fixing: patching identified bugs…");
          const fixPrompt = `Files:\n${JSON.stringify(files, null, 2)}\n\nIssues:\n${JSON.stringify(review.issues, null, 2)}`;
          const fixResult = parseJSONLoose(await callModel("fixer", fixerSystem(state.outputMode), fixPrompt));
          for (const f of fixResult.files) files[f.path] = f.content;
          logLine(`Patched ${fixResult.files.length} file(s).`);
        } else { logLine("Review passed — no issues found."); }
      }

      state.files = state.outputMode === "single-file" ? files : { ...state.files, ...files };
      renderFileTree();
      if (Object.keys(files)[0]) selectFile(Object.keys(files)[0]);
      setStage("done", "Done — file(s) ready in the panel.");
      addChatMessage("assistant", `Done. ${Object.keys(files).length} file(s) written/updated.${plan.notes ? "\n\nAssumptions made: " + plan.notes : ""}`);
      el.downloadBtn.disabled = false;
    } catch (err) {
      setStage("error", "Error: " + err.message);
      addChatMessage("system", `Something went wrong: ${err.message}`);
    } finally { el.send.disabled = false; }
  }

  function addChatMessage(role, text) {
    state.messages.push({ role, text });
    const bubble = document.createElement("div"); bubble.className = `msg msg-${role}`; bubble.textContent = text;
    el.chat.appendChild(bubble); el.chat.scrollTop = el.chat.scrollHeight;
  }

  el.send.addEventListener("click", handleSend);
  el.input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } });
  function handleSend() {
    const text = el.input.value.trim();
    if (!text || el.send.disabled) return;
    addChatMessage("user", text); el.input.value = ""; runPipeline(text);
  }

  function renderFileTree() {
    el.fileTree.innerHTML = "";
    const paths = Object.keys(state.files).sort();
    if (!paths.length) { el.fileTree.innerHTML = `<div class="empty-hint">No files yet — describe what to build in the chat.</div>`; return; }
    for (const path of paths) {
      const item = document.createElement("div"); item.className = "file-item"; item.textContent = path;
      item.addEventListener("click", () => selectFile(path)); el.fileTree.appendChild(item);
    }
  }
  function selectFile(path) {
    document.querySelectorAll(".file-item").forEach(n => n.classList.remove("active"));
    [...el.fileTree.children].find(n => n.textContent === path)?.classList.add("active");
    el.codeViewLabel.textContent = path; el.codeView.textContent = state.files[path] ?? "";
  }

  el.downloadBtn.addEventListener("click", async () => {
    const paths = Object.keys(state.files);
    if (!paths.length) return;
    if (state.outputMode === "single-file" && paths.length === 1) {
      const path = paths[0];
      const blob = new Blob([state.files[path]], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = path; a.click();
      URL.revokeObjectURL(url); return;
    }
    const zip = new JSZip();
    for (const [path, content] of Object.entries(state.files)) zip.file(path, content);
    const blob = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "codebox-project.zip"; a.click();
    URL.revokeObjectURL(url);
  });

  renderFileTree();
  addChatMessage("system", `Output mode: ${state.outputMode}. Knows real-world patterns for: ${Object.keys(PATTERN_LIBRARY).join(", ")} — mention one of these and it'll build the full expected feature set automatically. Anything else still works, just with more generic defaults.`);
  </script>
</body>
</html>
